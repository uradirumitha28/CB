<!DOCTYPE html>
<html>
<head>
    <title>Event Table</title>
    <style>
        table {
            width: 80%;
            margin: 30px auto;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #4CAF50;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>

    <h2 style="text-align:center;">Upcoming Events</h2>

    <table>
        <tr>
            <th>Event Name</th>
            <th>Date</th>
            <th>Time</th>
            <th>Venue</th>
            <th>Organizer</th>
        </tr>

        <tr>
            <td>Tech Fest 2026</td>
            <td>10 October 2026</td>
            <td>10:00 AM</td>
            <td>Main Auditorium</td>
            <td>Computer Science Club</td>
        </tr>

        <tr>
            <td>Sports Day</td>
            <td>15 October 2026</td>
            <td>9:00 AM</td>
            <td>College Ground</td>
            <td>Sports Committee</td>
        </tr>

        <tr>
            <td>Cultural Fest</td>
            <td>20 October 2026</td>
            <td>5:00 PM</td>
            <td>Open Stage</td>
            <td>Cultural Club</td>
        </tr>
    </table>

</body>
</html>
